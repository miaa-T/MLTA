# PubMedQA from a parquet copy of the dataset. The built-in lm-eval task
# "pubmedqa" needs a dataset loading script, which recent versions of the
# `datasets` library no longer run. Same prompt as the built-in task.
task: pubmedqa_parquet
dataset_path: qiaojin/PubMedQA
dataset_name: pqa_labeled
output_type: multiple_choice
test_split: train
doc_to_text: "Abstract: {{context.contexts | join('\n')}}\nQuestion: {{question}}\nAnswer:"
doc_to_target: final_decision
doc_to_choice: ["yes", "no", "maybe"]
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
